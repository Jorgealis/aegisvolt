name: pr-checks

# Checks obligatorios antes de habilitar el Merge hacia dev / test / prod.
# Los nombres de los jobs son los "status checks" exigidos por el ruleset
# protected-envs (docs/rulesets/protected-envs.json).
on:
  pull_request:
    branches: [dev, test, prod]

permissions:
  contents: read

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  enforce-promotion:
    runs-on: ubuntu-latest
    steps:
      - name: Validar cadena feature/* -> dev -> test -> prod
        env:
          BASE: ${{ github.base_ref }}
          HEAD: ${{ github.head_ref }}
        run: |
          echo "PR: $HEAD -> $BASE"
          if [[ "$BASE" == "dev"  && "$HEAD" != feature/* ]]; then echo "::error::Solo feature/* -> dev";  exit 1; fi
          if [[ "$BASE" == "test" && "$HEAD" != "dev"      ]]; then echo "::error::Solo dev -> test";    exit 1; fi
          if [[ "$BASE" == "prod" && "$HEAD" != "test"     ]]; then echo "::error::Solo test -> prod";   exit 1; fi
          echo "Promoción válida"

  lint-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: ruff (lint + formato)
        run: ruff check services tests scripts observability && ruff format --check services tests scripts observability
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend (tipos + build)
        working-directory: frontend
        run: npm ci --no-audit --no-fund && npm run build
      - name: Esquema GraphQL válido y al día
        run: python scripts/export_schema.py --check
      - name: docker build de las 4 imágenes
        run: |
          for svc in station-reservation-service:station_reservation billing-wallet-service:billing_wallet \
                     energy-dispatch-service:energy_dispatch graphql-gateway:graphql_gateway; do
            dir="${svc%%:*}"; pkg="${svc##*:}"
            docker build -q -f services/Dockerfile --build-arg SERVICE_DIR="$dir" --build-arg PACKAGE="$pkg" -t "aegisvolt/$dir:ci" services
          done
      - name: Manifiestos Kubernetes (generados al día + kustomize + kubeconform con CRDs de Argo)
        run: |
          python scripts/gen_k8s_base.py >/dev/null && git diff --exit-code k8s/base
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz | tar xz kubeconform
          for e in dev test prod; do
            echo "== overlay $e"
            kubectl kustomize "k8s/overlays/$e" | ./kubeconform -strict -summary \
              -schema-location default \
              -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'
          done
          kubectl kustomize k8s/platform/argo-rollouts > /dev/null
      - uses: hashicorp/setup-terraform@v3
      - name: terraform fmt
        run: terraform fmt -check -recursive infra
      - name: terraform validate (bootstrap y ambientes)
        run: |
          (cd infra/bootstrap && terraform init -backend=false -input=false && terraform validate)
          (cd infra && terraform init -backend=false -input=false && terraform validate)

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: pytest tests/unit -q

  integration-tests:
    runs-on: ubuntu-latest
    services:
      dynamodb:
        image: amazon/dynamodb-local:latest
        ports: ["8001:8000"]
    env:
      DYNAMODB_ENDPOINT: http://localhost:8001
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements-dev.txt
      # CI=true: si DynamoDB Local no responde, los tests FALLAN (no se omiten en verde)
      - run: pytest tests/integration -q -rs

  e2e-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Levantar stack (4 servicios + DynamoDB Local)
        run: docker compose up -d --build --wait --wait-timeout 180
      - name: Crear tablas y sembrar datos
        run: python scripts/seed.py --env local --endpoint http://localhost:8001 --create-tables
      - name: Flujo completo por la API GraphQL
        run: pytest tests/e2e -q -rs
      - name: Logs de los servicios
        if: failure()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down -v

  terraform-plan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC -> rol aegisvolt-gha-plan (solo lectura)
    env:
      TARGET_ENV: ${{ github.base_ref }} # workspace = rama destino (dev | test | prod)
    steps:
      - uses: actions/checkout@v5
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: us-east-1
      - uses: hashicorp/setup-terraform@v3
      - name: terraform plan (${{ env.TARGET_ENV }})
        working-directory: infra
        run: |
          terraform init -input=false
          terraform workspace select "$TARGET_ENV"
          terraform plan -input=false -lock=false -var-file="envs/$TARGET_ENV.tfvars" -no-color | tee plan.txt
      - uses: actions/upload-artifact@v4
        with:
          name: plan-${{ github.base_ref }}
          path: infra/plan.txt
