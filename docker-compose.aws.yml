# Override: los contenedores locales usan las tablas y log groups REALES de un
# ambiente en AWS (dev por defecto; AEGIS_ENV=test|prod para los otros).
# Usa tus credenciales de ~/.aws (montadas en solo lectura dentro del contenedor).
#   $env:AEGIS_ENV = "test"
#   docker compose -f docker-compose.yml -f docker-compose.aws.yml up -d --build
#   python scripts/seed.py --env $env:AEGIS_ENV
x-aws-env: &aws-env
  ENV: ${AEGIS_ENV:-dev}
  APP_VERSION: local-aws
  DYNAMODB_ENDPOINT: ""
  AWS_ACCESS_KEY_ID: !reset null
  AWS_SECRET_ACCESS_KEY: !reset null
  AWS_SHARED_CREDENTIALS_FILE: /home/app/.aws/credentials
  AWS_CONFIG_FILE: /home/app/.aws/config

x-aws-volume: &aws-volume
  - ${USERPROFILE:-${HOME}}/.aws:/home/app/.aws:ro

services:
  station-reservation-service:
    environment: { <<: *aws-env, CLOUDWATCH_LOG_GROUP: "/aegisvolt/${AEGIS_ENV:-dev}/station-reservation" }
    volumes: *aws-volume
  billing-wallet-service:
    environment: { <<: *aws-env, CLOUDWATCH_LOG_GROUP: "/aegisvolt/${AEGIS_ENV:-dev}/billing-wallet" }
    volumes: *aws-volume
  energy-dispatch-service:
    environment: { <<: *aws-env, CLOUDWATCH_LOG_GROUP: "/aegisvolt/${AEGIS_ENV:-dev}/energy-dispatch" }
    volumes: *aws-volume
  graphql-gateway:
    environment: { <<: *aws-env, CLOUDWATCH_LOG_GROUP: "/aegisvolt/${AEGIS_ENV:-dev}/graphql-gateway" }
    volumes: *aws-volume
