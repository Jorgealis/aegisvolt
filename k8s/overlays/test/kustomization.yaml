# Ambiente test: namespace propio, ConfigMap del ambiente y 2 réplica(s) por servicio.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: aegisvolt-test

resources:
  - namespace.yaml
  - ../../base

# El análisis del canary lee este label para filtrar las métricas del ambiente.
labels:
  - pairs:
      aegisvolt.io/env: test
    includeSelectors: false

generatorOptions:
  disableNameSuffixHash: true # los Rollouts (CRD) referencian el ConfigMap por nombre fijo

configMapGenerator:
  - name: aegisvolt-config
    literals:
      - ENV=test
      - AWS_REGION=us-east-1
      - SURGE_HOURS=18-21

patches:
  - target:
      kind: Rollout
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
